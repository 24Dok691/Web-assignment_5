<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="qw">
    <div class="head">
      <h1>JavaScript</h1>
      <nav class="ahref">
        <a href="index.html">Intro</a>
        <a href="dom.html">DOM</a>
        <a href="events.html" class="active">Events</a>
        <a href="todo.html">To-Do</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="profile-card">
      <h1 class="text-center">Part 3. Events</h1>

      <div class="task">
        <h2>Task 5. Mouse Events</h2>
        <div id="hover-box">Hover me</div>
      </div>

      <div class="task">
        <h2>Task 6. Keyboard Events</h2>
        <input type="text" id="key-input" class="form-control" placeholder="Type something...">
        <p>You typed: <span id="key-output"></span></p>
      </div>

      <div class="task">
        <h2>Task 7. Calculator</h2>
        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <input type="number" id="num1" class="form-control" placeholder="First number">
          </div>
          <div class="col-md-6">
            <input type="number" id="num2" class="form-control" placeholder="Second number">
          </div>
        </div>
        <button class="btn btn-dark" data-op="+">+</button>
        <button class="btn btn-dark" data-op="-">-</button>
        <button class="btn btn-dark" data-op="*">&times;</button>
        <button class="btn btn-dark" data-op="/">&divide;</button>
        <p>Result: <span id="calc-result">-</span></p>
      </div>
    </section>
  </main>
